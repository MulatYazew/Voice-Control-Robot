[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voce"
version = "0.1.0"
description = "VOCE — Italian voice control for a UR robotic arm (Grok Voice)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["voice/*.md"]
grokarm_vision = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live xAI and/or URSim (deselect with -m 'not integration')"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
