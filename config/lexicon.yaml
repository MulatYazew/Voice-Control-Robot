    it: [sinistra, a sinistra, zona sinistra, sx]
    en: [left]
    zh: [左, 左边]
    ja: [左, ひだり, 左側]
    am: [ግራ]
    other: [izquierda, gauche, links]
  centro:
    it: [centro, centrale, al centro, zona centrale, zona centro, in mezzo, mezzo]
    en: [center, centre, middle, central]
    zh: [中间, 中央]
    ja: [真ん中, 中央]
    am: [መሃል]
  destra:
    it: [destra, a destra, zona destra, dx]
    en: [right]
    zh: [右, 右边]
    ja: [右, みぎ]
    am: [ቀኝ]
    other: [derecha, droite, rechts]

directions:
  sinistra:
    it: [sinistra, a sinistra, sx]
    en: [left]
    zh: [左, 左边]
    ja: [左, ひだり]
    am: [ግራ]
  destra:
    it: [destra, a destra, dx]
    en: [right]
    zh: [右, 右边]
    ja: [右, みぎ]
    am: [ቀኝ]
  scarto:
    it: [scarto]
    en: [scarto]
    zh: [scarto]
    ja: [scarto]
    am: [scarto]

# Close the assistant. Every entry names the assistant or the session.
# A bare "stop", "basta", "fine" or "chiudi" must not match.
# am is NOT VERIFIED until reviewed_by.am is a person's name.
terminate:
  it:
    - chiudi l'assistente
    - termina l'assistente
    - spegni l'assistente
    - chiudi la sessione
    - termina la sessione
    - fine sessione
  en:
    - close the assistant
    - turn off the assistant
    - end the session
    - close the session
  zh:
    - 关闭助手
    - 结束会话
    - 关掉助手
  ja:
    - アシスタントを終了
    - アシスタントを閉じて
    - セッションを終了
  am:
    - ረዳቱን ዝጋ
    - ክፍለ ጊዜውን ጨርስ

# Substring / token triggers for the rules engine (TEXT MODE). Canonical skill ids.
skill_triggers:
  solleva_vassoio:
    zh: [抬起来, 抬起, 举起, 拿起, 抬]
    ja: [持ち上げて, 持ち上げ, 上げて]
    am: [አንሳ]
  appoggia_vassoio:
    zh: [放下, 放回, 放下来]
    ja: [置いて, 下ろして]
    am: [አስቀምጥ]
  spingi:
    zh: [推过去, 推]
    ja: [押して, 押す]
    am: [ግፋ]
  indica:
    zh: [指一下, 指示, 指着, 指]
    ja: [指して, 示して]
    am: [አመልክት]
  vai_a_posa:
    zh: [回家, 回到, 回到原点]
    ja: [戻って, ホーム]
    am: [ቤት ተመለስ]
  sposta_vassoio:
    zh: [搬到, 移到, 拿到]
    ja: [移動して, 持っていって]
    am: [አንቀሳቅስ]
