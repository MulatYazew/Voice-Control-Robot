# Deterministic skill registry. Grok can only *propose* these, with these parameters.
# Motion sequences reference named poses in config/poses.yaml ({posizione}/{direzione} are
# substituted with validated parameter values). The sequences are the team's assumed
# structure and must be checked against the real cell (see PROJECT_STATUS.md).

skills:
  vai_a_posa:
    descrizione: "Porta il braccio in una posa predefinita."
    strumento: null
    parametri:
      posa: {tipo: posa}                 # allowed values = selectable poses in poses.yaml
    precondizioni: []
    sequenza:
      - {move: movej, posa: "{posa}"}
    timeout_s: 30
    conferma: "Porto il braccio nella posa {posa}. Confermi?"
    risultato: "Il braccio è nella posa {posa}."
    conferma_en: "Moving the arm to pose {posa}. Do you confirm?"
    risultato_en: "The arm is at pose {posa}."
    in_caso_di_errore: fault

  indica:
    descrizione: "Indica una zona con la punta, senza toccare nulla."
    strumento: punta
    parametri:
      posizione: {tipo: zona}
    precondizioni: []
    sequenza:
      - {move: movej, posa: "{posizione}_sopra"}
      - {move: movel, posa: "{posizione}_indica"}
      - {move: wait, secondi: 1.0}
      - {move: movel, posa: "{posizione}_sopra"}
    timeout_s: 40
    conferma: "Indico la zona {posizione} con la punta. Confermi?"
    risultato: "Ho indicato la zona {posizione}."
    conferma_en: "Pointing at the {posizione} zone with the tip. Do you confirm?"
    risultato_en: "Pointed at the {posizione} zone."
    in_caso_di_errore: fault

  solleva_vassoio:
    descrizione: "Solleva con la forca il vassoio che si presume sia nella zona indicata."
    strumento: forca
    parametri:
      posizione: {tipo: zona}
    precondizioni: [forca_libera, vassoio_presunto_in_zona]
    sequenza:
      - {move: movej, posa: "{posizione}_sopra"}
      - {move: movel, posa: "{posizione}_presa"}
      - {move: movel, posa: "{posizione}_sopra"}
    timeout_s: 45
    conferma: "Sollevo con la forca il vassoio nella zona {posizione}. Confermi?"
    risultato: "Sequenza di sollevamento completata nella zona {posizione}."
    conferma_en: "Lifting the tray in the {posizione} zone with the fork. Do you confirm?"
    risultato_en: "Lifting sequence completed in the {posizione} zone."
    in_caso_di_errore: fault

  appoggia_vassoio:
    descrizione: "Appoggia il vassoio portato sulla forca nella zona indicata."
    strumento: forca
    parametri:
      posizione: {tipo: zona}
    precondizioni: [vassoio_sulla_forca, zona_libera]
    sequenza:
      - {move: movej, posa: "{posizione}_sopra"}
      - {move: movel, posa: "{posizione}_presa"}
      - {move: movel, posa: "{posizione}_sopra"}
    timeout_s: 45
    conferma: "Appoggio il vassoio nella zona {posizione}. Confermi?"
    risultato: "Sequenza di appoggio completata nella zona {posizione}."
    conferma_en: "Putting the tray down in the {posizione} zone. Do you confirm?"
    risultato_en: "Put-down sequence completed in the {posizione} zone."
    in_caso_di_errore: fault

  spingi:
    descrizione: "Spinge con lo spintore il vassoio nella zona indicata, verso una direzione."
    strumento: spintore
    parametri:
      posizione: {tipo: zona}
      direzione: {tipo: direzione}
    precondizioni: [forca_libera, vassoio_presunto_in_zona]
    sequenza:
      - {move: movej, posa: "{posizione}_spinta_{direzione}_inizio"}
      - {move: movel, posa: "{posizione}_spinta_{direzione}_fine"}
      - {move: movel, posa: "{posizione}_sopra"}
    timeout_s: 45
    conferma: "Spingo il vassoio nella zona {posizione} verso {direzione}. Confermi?"
    risultato: "Spinta completata nella zona {posizione} verso {direzione}."
    conferma_en: "Pushing the tray in the {posizione} zone towards {direzione}. Do you confirm?"
    risultato_en: "Push completed in the {posizione} zone towards {direzione}."
    in_caso_di_errore: fault

  sposta_vassoio:
    descrizione: "Sposta il vassoio da una zona a un'altra con la forca (solleva e appoggia). Un solo movimento, una sola conferma."
    strumento: forca
    parametri:
      origine: {tipo: zona}
      destinazione: {tipo: zona}
    precondizioni: [forca_libera, vassoio_presunto_in_zona, zona_libera, zone_diverse]
    sequenza:
      - {move: movej, posa: "{origine}_sopra"}
      - {move: movel, posa: "{origine}_presa"}
      - {move: movel, posa: "{origine}_sopra"}
      - {move: movej, posa: "{destinazione}_sopra"}
      - {move: movel, posa: "{destinazione}_presa"}
      - {move: movel, posa: "{destinazione}_sopra"}
    timeout_s: 60
    conferma: "Sposto il vassoio dalla zona {origine} alla zona {destinazione}. Confermi?"
    risultato: "Spostamento completato da {origine} a {destinazione}."
    conferma_en: "Moving the tray from the {origine} zone to the {destinazione} zone. Do you confirm?"
    risultato_en: "Move completed from {origine} to {destinazione}."
    in_caso_di_errore: fault

  porta_in_ispezione:
    descrizione: "Preleva con la forca il pezzo dal vassoio di ingresso e lo tiene davanti alla telecamera."
    strumento: forca
    parametri:
      posizione: {tipo: zona}
    precondizioni: [forca_libera, vassoio_presunto_in_zona, zona_di_ingresso]
    sequenza:
      - {move: movej, posa: "{posizione}_sopra"}
      - {move: movel, posa: "{posizione}_presa"}
      - {move: movel, posa: "{posizione}_sopra"}
      - {move: movej, posa: "ispezione"}
    timeout_s: 60
    conferma: "Prelevo il pezzo dal vassoio {posizione} e lo porto davanti alla telecamera. Confermi?"
    risultato: "Il pezzo è davanti alla telecamera."
    conferma_en: "Picking the part from tray {posizione} and holding it in front of the camera. Do you confirm?"
    risultato_en: "The part is in front of the camera."
    in_caso_di_errore: fault

  smista:
    descrizione: "Deposita il pezzo ispezionato nel vassoio approvati o scartati."
    strumento: forca
    parametri:
      posizione: {tipo: zona}
    precondizioni: [vassoio_sulla_forca, zona_di_uscita]
    sequenza:
      - {move: movej, posa: "{posizione}_sopra"}
      - {move: movel, posa: "{posizione}_presa"}
      - {move: movel, posa: "{posizione}_sopra"}
    timeout_s: 60
    conferma: "Deposito il pezzo nel vassoio {posizione}. Confermi?"
    risultato: "Pezzo depositato nel vassoio {posizione}."
    conferma_en: "Placing the part in tray {posizione}. Do you confirm?"
    risultato_en: "Part placed in tray {posizione}."
    in_caso_di_errore: fault
