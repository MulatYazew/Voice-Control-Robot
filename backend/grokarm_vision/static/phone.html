<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrokArm camera</title>
<style>
  :root { color-scheme: dark; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b0f14; color: #e5e7eb; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 6px 0; color: #9ca3af; font-size: 14px; }
  video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 16/9; object-fit: contain; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button, label.btn { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px;
    border: 0; border-radius: 12px; font: 600 16px system-ui; color: #0b0f14; background: #e5e7eb; cursor: pointer; }
  button.primary { background: var(--ok); }
  button.stop { background: #374151; color: #e5e7eb; }
  label.btn input { display: none; }
  #status { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #111827; font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: #6b7280; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .lang { float: right; background: #111827; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; padding: 4px 6px; }
</style>
</head>
<body>
<main>
  <select class="lang" id="lang" aria-label="Language">
    <option value="en">EN</option><option value="zh">中文</option><option value="it">IT</option>
  </select>
  <h1 data-t="title"></h1>
  <p data-t="hint1"></p>
  <p data-t="hint2"></p>
  <video id="video" autoplay playsinline muted></video>
  <div class="row">
    <button id="start" class="primary" type="button" data-t="start"></button>
    <button id="stop" class="stop" type="button" data-t="stop" hidden></button>
  </div>
  <div class="row">
    <label class="btn"><span data-t="photo"></span><input id="file" type="file" accept="image/*" capture="environment"></label>
  </div>
  <div id="status"><span class="dot" id="dot"></span><span id="msg"></span></div>
  <canvas id="canvas" hidden></canvas>
</main>
<script>
const T = {
  en: { title: "GrokArm table camera", hint1: "Fix the phone on a tripod above the table. Do not move it after calibration.",
        hint2: "Keep this page open with the screen on. Landscape, top of the picture = far side of the table.",
        start: "Start sending video", stop: "Pause", photo: "Send one photo instead",
        idle: "Not sending.", opening: "Opening camera…", sending: "Sending · {fps} frames/s · {w}×{h}",
        denied: "Camera blocked: {e}. Accept the certificate warning and allow the camera, or send a photo.",
        fail: "Laptop not reachable: {e}", sent: "Photo sent {t}" },
  zh: { title: "GrokArm 桌面相机", hint1: "把手机固定在三脚架上，从上方拍桌面。标定后不要再移动手机。",
        hint2: "保持此页面打开、屏幕常亮。横屏，画面上方 = 离机器人较远的桌边。",
        start: "开始发送视频", stop: "暂停", photo: "改为发送一张照片",
        idle: "未发送。", opening: "正在打开相机…", sending: "发送中 · 每秒 {fps} 帧 · {w}×{h}",
        denied: "相机被阻止：{e}。请接受证书警告并允许使用相机，或改为发送照片。",
        fail: "连不上电脑：{e}", sent: "照片已发送 {t}" },
  it: { title: "Fotocamera del tavolo GrokArm", hint1: "Fissa il telefono su un treppiede sopra il tavolo. Non spostarlo dopo la calibrazione.",
        hint2: "Tieni la pagina aperta e lo schermo acceso. Orizzontale, in alto = lato lontano del tavolo.",
        start: "Invia il video", stop: "Pausa", photo: "Invia una foto",
        idle: "Non sto inviando.", opening: "Apro la fotocamera…", sending: "Invio · {fps} fotogrammi/s · {w}×{h}",
        denied: "Fotocamera bloccata: {e}. Accetta il certificato e consenti la fotocamera, oppure invia una foto.",
        fail: "Computer non raggiungibile: {e}", sent: "Foto inviata {t}" },
};
const SEND_WIDTH = 1280;
const INTERVAL_MS = 400;
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas");
let lang = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2);
if (!T[lang]) lang = "en";
let stream = null, timer = null, sent = 0, windowStart = performance.now(), busy = false, wakeLock = null;

function t(key, vars = {}) { return T[lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }
function applyLang() {
  $("lang").value = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  if (!stream) setStatus("", t("idle"));
}
function setStatus(kind, text) { $("dot").className = "dot " + kind; $("msg").textContent = text; }

async function post(blob) {
  const r = await fetch("/api/frame", { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
}

function grab() {
  if (busy || !video.videoWidth) return;
  const scale = SEND_WIDTH / video.videoWidth;
  canvas.width = SEND_WIDTH;
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  busy = true;
  canvas.toBlob(async (blob) => {
    try {
      await post(blob);
      sent++;
      const dt = (performance.now() - windowStart) / 1000;
      if (dt > 2) { windowStart = performance.now(); sent = 0; }
      setStatus("ok", t("sending", { fps: dt > 0 ? (sent / dt).toFixed(1) : "…", w: canvas.width, h: canvas.height }));
    } catch (e) { setStatus("bad", t("fail", { e: e.message })); }
    finally { busy = false; }
  }, "image/jpeg", 0.85);
}

async function start() {
  setStatus("warn", t("opening"));
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) { stream = null; setStatus("bad", t("denied", { e: e.message || e.name })); return; }
  video.srcObject = stream;
  timer = setInterval(grab, INTERVAL_MS);
  $("start").hidden = true; $("stop").hidden = false;
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
}
function stop() {
  clearInterval(timer); timer = null;
  stream?.getTracks().forEach((tr) => tr.stop()); stream = null;
  wakeLock?.release?.(); wakeLock = null;
  $("start").hidden = false; $("stop").hidden = true;
  setStatus("", t("idle"));
}

$("start").onclick = start;
$("stop").onclick = stop;
$("lang").onchange = (e) => { lang = e.target.value; localStorage.setItem("lang", lang); applyLang(); };
$("file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = await createImageBitmap(file);
  canvas.width = SEND_WIDTH; canvas.height = Math.round(img.height * SEND_WIDTH / img.width);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async (blob) => {
    try { await post(blob); setStatus("ok", t("sent", { t: new Date().toLocaleTimeString() })); }
    catch (err) { setStatus("bad", t("fail", { e: err.message })); }
  }, "image/jpeg", 0.9);
  e.target.value = "";
};
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && stream) {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
  }
});
applyLang();
</script>
</body>
</html>
